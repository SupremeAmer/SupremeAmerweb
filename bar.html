<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupremeAmer Info</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e293b;
      --accent: #6ee7b7;
      --text: #f1f5f9;
      --secondary: #0f172a;
      --highlight: #fde68a;
      --hover: #60a5fa;
    }
    body {
      margin: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.7s cubic-bezier(.77,0,.18,1);
    }
    header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2rem 0.5rem 2rem;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--accent);
      animation: fadeInDown 1s;
    }
    .logo-container img {
      border-radius: 16px;
      width: 60px;
      height: 60px;
      border: 2px solid var(--accent);
      box-shadow: 0 0 10px var(--accent), 0 2px 10px #0005;
      transition: transform 0.3s;
    }
    .logo-container img:hover {
      transform: scale(1.08) rotate(-4deg);
    }
    .back-arrow {
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.3s;
      margin-right: 1rem;
    }
    .back-arrow img {
      width: 34px;
      height: 34px;
      vertical-align: middle;
      border-radius: 10px;
      border: 2px solid var(--highlight);
      box-shadow: 0px 2px 5px #0003;
    }
    .back-arrow:hover img {
      transform: translateX(-7px) scale(1.08);
      border-color: var(--hover);
    }
    nav {
      width: 100%;
      margin: 2rem 0 1rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      animation: fadeInUp 1.2s;
    }
    .bar {
      width: 95%;
      max-width: 700px;
      background: var(--secondary);
      border-radius: 25px;
      box-shadow: 0 8px 32px 0 #0002;
      padding: 2rem 2rem 1rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      border: 2px solid var(--accent);
      transition: box-shadow 0.5s;
      animation: slideIn 1s;
    }
    .bar h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: color 0.25s;
      line-height: 1.4;
      text-align: left;
    }
    .bar h1 a {
      text-decoration: none;
      color: var(--highlight);
      position: relative;
      transition: color 0.3s;
    }
    .bar h1 a::after {
      content: '';
      display: block;
      width: 0;
      height: 3px;
      background: var(--accent);
      transition: width .3s;
      position: absolute;
      left: 0; bottom: -3px;
    }
    .bar h1 a:hover, .bar h1 a:focus {
      color: var(--hover);
    }
    .bar h1 a:hover::after, .bar h1 a:focus::after {
      width: 100%;
    }
    /* Suggested words/links section */
    .suggested {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      animation: fadeIn 1.4s;
    }
    .suggested-title {
      font-size: 1.07rem;
      color: var(--accent);
      margin-bottom: 0.2rem;
      font-weight: bold;
    }
    .suggested-list {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
    }
    .suggested-link {
      background: var(--highlight);
      color: var(--primary);
      border-radius: 15px;
      padding: 0.4rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.3s, color 0.3s, transform 0.2s;
      cursor: pointer;
      border: none;
      text-decoration: none;
      outline: none;
      box-shadow: 0 2px 6px #0002;
      animation: popIn 0.7s ease;
    }
    .suggested-link:hover {
      background: var(--accent);
      color: var(--primary);
      transform: translateY(-3px) scale(1.03);
    }
    /* Contact Section */
    .contact-section {
      text-align: center;
      margin: 2.5rem 0 1.5rem 0;
      animation: fadeIn 1.1s;
    }
    .contact-section h2 {
      margin-bottom: 1rem;
      color: var(--accent);
      font-size: 1.25rem;
      font-family: 'Roboto', Arial, sans-serif;
      letter-spacing: 1px;
    }
    .socials {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 0.5rem;
    }
    .social-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: 0 2px 10px #0004;
      transition: border-color 0.3s, transform 0.2s, box-shadow 0.3s;
      background: #fff;
      object-fit: cover;
      animation: floatIn 1.2s;
    }
    .social-icon:hover {
      border-color: var(--hover);
      transform: scale(1.13) rotate(-7deg);
      box-shadow: 0 4px 20px #6ee7b7aa;
    }
    /* Animations */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px);}
      to   { opacity: 1; transform: translateY(0);}
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px);}
      to   { opacity: 1; transform: translateY(0);}
    }
    @keyframes fadeIn {
      from { opacity: 0;}
      to   { opacity: 1;}
    }
    @keyframes slideIn {
      0% { transform: translateX(-40px) scale(0.97); opacity: 0.3;}
      100% { transform: translateX(0) scale(1); opacity: 1;}
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0;}
      100% { transform: scale(1); opacity: 1;}
    }
    @keyframes floatIn {
      0% { transform: translateY(25px) scale(0.8); opacity: 0;}
      100% { transform: translateY(0) scale(1); opacity: 1;}
    }
    @media (max-width: 600px) {
      .bar, header { padding: 1rem; }
      .bar { max-width: 98vw; }
      .logo-container { font-size: 1.3rem; }
    }
  </style>
</head>
