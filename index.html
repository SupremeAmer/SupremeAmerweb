<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupremeAmer application development organization</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="about">
            <h1>About SupremeAmer</h1>
            <p>SupremeAmer is an application development organization that specializes in creating innovative solutions for businesses and individuals.</p>
        </section>
        <section id="services">
            <h1>Services</h1>
            <ul>
                <li>Website Design</li>
                <li>Web Development</li>
                <li>Mobile App Development</li>
            </ul>
        </section>
        <section id="contact">
            <h1>Contact Us</h1>
            <form id="request-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name"><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email"><br><br>
                <label for="project-type">Project Type:</label>
                <select id="project-type" name="project-type">
                    <option value="website">Website</option>
                    <option value="web-app">Web App</option>
                    <option value="mobile-app">Mobile App</option>
                </select><br><br>
                <label for="payment-method">Payment Method:</label>
                <select id="payment-method" name="payment-method">
                    <option value="naira">Naira (NGN)</option>
                    <option value="usdt">USDT</option>
                </select><br><br>
                <button id="submit-btn">Submit Request</button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
